services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-arcade}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arcade}
      POSTGRES_DB: ${DB_NAME:-arcade}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arcade}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-arcade}:${DB_PASSWORD:-arcade}@db:5432/${DB_NAME:-arcade}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
